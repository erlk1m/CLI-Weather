[package]
name = "rust-weather-vercel"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros"] }
vercel_runtime = { version = "2.2.0" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
url = "2.5"
urlencoding = "2.1"

[[bin]]
name = "weather"
path = "api/weather.rs"
