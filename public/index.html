<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLI Weather Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="buttons">
                <span class="close"></span>
                <span class="minimize"></span>
                <span class="maximize"></span>
            </div>
            <div class="title">user@weather-cli:~</div>
        </div>
        <div class="terminal-body" id="terminal-body">
            <div class="output">
                <span class="sys-msg">Welcome to CLI Weather Terminal v1.0.0</span><br>
                <span class="sys-msg">Type a city name to get the weather forecast (e.g. 'Jakarta' or 'Bandung').</span><br>
                <span class="sys-msg">Type 'clear' to clear the screen.</span><br><br>
            </div>
            <div class="input-line">
                <span class="prompt">root@weather-cli:~$ </span>
                <input type="text" id="command-input" autocomplete="off" autofocus spellcheck="false">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
